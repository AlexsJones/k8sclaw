name: Framework universal create UI

on:
  push:
    branches: [fix/session-runtime-agentrun-boundary]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: images/apiserver/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ghcr.io/sympozium-ai/sympozium/apiserver:ae120fa
          cache-from: type=gha,scope=apiserver
          cache-to: type=gha,mode=max,scope=apiserver
