<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" role="img" aria-labelledby="title desc">
  <title id="title">The AgentHarness run lifecycle</title><desc id="desc">Four stages: approve an AgentRuntime, select it on an AgentRun, execute the external harness in an isolated pod, and validate and record its result.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#e8562a"/></marker><style>.bg{fill:#111110}.panel{fill:#1a1a18;stroke:#484841;stroke-width:2}.box{fill:#22221f;stroke:#73736a;stroke-width:2}.hot{fill:#352019;stroke:#e8562a;stroke-width:2}.n{fill:#e8562a;font:700 14px Inter,Arial,sans-serif}.h{fill:#f0ece4;font:700 22px Inter,Arial,sans-serif}.t{fill:#c9c5bb;font:15px Inter,Arial,sans-serif}.s{fill:#8a8c82;font:13px Inter,Arial,sans-serif}.line{stroke:#e8562a;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
  <rect class="bg" width="1600" height="420" rx="18"/><text x="50" y="60" class="h">AgentHarness run lifecycle</text><text x="50" y="88" class="t">An approved runtime is selected, run under the existing platform controls, then recorded like any other AgentRun.</text>
  <path class="line" d="M372 230H420"/><path class="line" d="M770 230H818"/><path class="line" d="M1168 230H1216"/>
  <g transform="translate(50 125)"><rect class="panel" width="322" height="220" rx="12"/><circle class="hot" cx="44" cy="44" r="23"/><text x="39" y="50" class="n">01</text><text x="82" y="51" class="h">Approve</text><rect class="box" x="28" y="88" width="266" height="92" rx="8"/><text x="48" y="123" class="t">AgentRuntime</text><text x="48" y="149" class="s">digest-pinned image · v1alpha1</text><text x="48" y="169" class="s">conformance + support owner</text><text x="28" y="205" class="s">Policy enables harness mode.</text></g>
  <g transform="translate(420 125)"><rect class="panel" width="350" height="220" rx="12"/><circle class="hot" cx="44" cy="44" r="23"/><text x="39" y="50" class="n">02</text><text x="82" y="51" class="h">Select</text><rect class="box" x="28" y="88" width="294" height="92" rx="8"/><text x="48" y="123" class="t">Agent + AgentRun</text><text x="48" y="149" class="s">runtimeRef is inherited or overridden</text><text x="48" y="169" class="s">task, model and skills stay declarative</text><text x="28" y="205" class="s">Admission rejects unapproved images.</text></g>
  <g transform="translate(818 125)"><rect class="panel" width="350" height="220" rx="12"/><circle class="hot" cx="44" cy="44" r="23"/><text x="39" y="50" class="n">03</text><text x="82" y="51" class="h">Execute</text><rect class="box" x="28" y="88" width="294" height="92" rx="8"/><text x="48" y="123" class="t">Isolated Job / Pod</text><text x="48" y="149" class="s">adapter starts the external harness</text><text x="48" y="169" class="s">skills and MCP arrive via gates</text><text x="28" y="205" class="s">The harness has no K8s identity.</text></g>
  <g transform="translate(1216 125)"><rect class="panel" width="334" height="220" rx="12"/><circle class="hot" cx="44" cy="44" r="23"/><text x="39" y="50" class="n">04</text><text x="82" y="51" class="h">Record</text><rect class="box" x="28" y="88" width="278" height="92" rx="8"/><text x="48" y="123" class="t">Validated result</text><text x="48" y="149" class="s">provenance · memory · events</text><text x="48" y="169" class="s">timeouts · metrics · audit trail</text><text x="28" y="205" class="s">Normal AgentRun lifecycle continues.</text></g>
</svg>
