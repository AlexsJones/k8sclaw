{{- if .Values.celln.enabled }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: celln-system
  labels:
    app.kubernetes.io/part-of: sympozium
---
apiVersion: v1
kind: Secret
metadata:
  name: celln-deepseek-key
  namespace: celln-system
  labels:
    app.kubernetes.io/part-of: sympozium
type: Opaque
data:
  DEEPSEEK_API_KEY: {{ .Values.celln.deepseekApiKey | default "" | b64enc | quote }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: celln-installer
  namespace: celln-system
  labels:
    app.kubernetes.io/name: celln-installer
    app.kubernetes.io/part-of: sympozium
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: celln-installer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: celln-installer
    spec:
      hostPID: true
      containers:
      - name: installer
        image: {{ .Values.celln.image.repository | default "ghcr.io/sympozium-ai/celln-installer" }}:{{ .Values.celln.image.tag | default "v0.4.13" }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        securityContext:
          privileged: true
        env:
        - name: DEEPSEEK_API_KEY
          valueFrom:
            secretKeyRef:
              name: celln-deepseek-key
              key: DEEPSEEK_API_KEY
              optional: true
        volumeMounts:
        - name: host-root
          mountPath: /host
        - name: host-run
          mountPath: /run/systemd
        - name: kvm
          mountPath: /dev/kvm
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
      volumes:
      - name: host-root
        hostPath:
          path: /
          type: Directory
      - name: host-run
        hostPath:
          path: /run
          type: Directory
      - name: kvm
        hostPath:
          path: /dev/kvm
          type: CharDevice
      nodeSelector:
        celln.dev/kvm: "true"
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
---
apiVersion: v1
kind: Service
metadata:
  name: celln-router
  namespace: celln-system
  labels:
    app.kubernetes.io/name: celln-router
    app.kubernetes.io/part-of: sympozium
spec:
  selector:
    app.kubernetes.io/name: celln-router
  ports:
  - name: http
    port: 8787
    targetPort: 8787
    protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celln-router
  namespace: celln-system
  labels:
    app.kubernetes.io/name: celln-router
    app.kubernetes.io/part-of: sympozium
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: celln-router
  template:
    metadata:
      labels:
        app.kubernetes.io/name: celln-router
    spec:
      containers:
      - name: router
        image: {{ .Values.celln.router.image.repository | default "ghcr.io/sympozium-ai/celln-router" }}:{{ .Values.celln.router.image.tag | default "v0.4.13" }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command: ["/usr/local/bin/celln"]
        args:
        - "route"
        - "--listen=0.0.0.0:8787"
        - "--backends=http://{{ .Values.celln.router.dispatcherHost | default "HOST_IP" }}:8787"
        - "--token-file=/etc/celln/dispatcher-token/token"
        - "--mode=round-robin"
        ports:
        - name: http
          containerPort: 8787
          protocol: TCP
        env:
        - name: PATH
          value: /usr/local/bin:/usr/bin:/bin
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
        volumeMounts:
        - name: token-vol
          mountPath: /etc/celln/dispatcher-token
          readOnly: true
        livenessProbe:
          tcpSocket:
            port: 8787
          initialDelaySeconds: 3
          periodSeconds: 30
        readinessProbe:
          tcpSocket:
            port: 8787
          initialDelaySeconds: 2
          periodSeconds: 10
        resources:
          requests:
            memory: "16Mi"
            cpu: "10m"
          limits:
            memory: "64Mi"
            cpu: "200m"
      volumes:
      - name: token-vol
        hostPath:
          path: /etc/celln/dispatcher-token
          type: Directory
---
apiVersion: v1
kind: Secret
metadata:
  name: celln-dispatcher-token
  namespace: celln-system
  labels:
    app.kubernetes.io/part-of: sympozium
type: Opaque
stringData:
  token: {{ .Values.celln.router.dispatcherToken | default (randAlphaNum 32) | quote }}
{{- end }}
