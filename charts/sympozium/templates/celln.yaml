{{- if .Values.celln.enabled }}
{{- if and (not (hasPrefix "https://" .Values.celln.routerUrl)) (not .Values.celln.allowInsecureHttp) }}
{{- fail "Celln requires an HTTPS routerUrl or explicit celln.allowInsecureHttp acknowledgement" }}
{{- end }}
{{- if not (regexMatch "^sha256:[a-f0-9]{64}$" .Values.celln.router.image.digest) }}
{{- fail "celln.router.image.digest must pin a router supporting client auth and durable ownership" }}
{{- end }}
{{- if not .Values.celln.router.backends }}
{{- fail "celln.router.backends must contain the complete stable dispatcher endpoint list" }}
{{- end }}
{{- range .Values.celln.router.backends }}
{{- if not (regexMatch "^http://[^/,?#@[:space:]]+(:[0-9]+)?$" .) }}
{{- fail "celln.router.backends requires explicit HTTP origins (HTTPS is not supported by this router)" }}
{{- end }}
{{- end }}
{{- if not .Values.celln.router.allowInsecureBackends }}
{{- fail "celln.router.allowInsecureBackends must explicitly acknowledge the plaintext backend transport" }}
{{- end }}
{{- if or (not .Values.celln.router.clientTokenSecret) (not .Values.celln.router.backendTokenSecret) (not .Values.celln.tokenSecret) }}
{{- fail "Celln requires controller, router client, and router backend token Secret references" }}
{{- end }}
{{- if eq .Values.celln.router.clientTokenSecret .Values.celln.router.backendTokenSecret }}
{{- fail "Celln client and backend credentials must use distinct Secrets" }}
{{- end }}
{{- if not .Values.celln.router.ownershipClaim }}
{{- fail "celln.router.ownershipClaim must reference durable shared POSIX storage" }}
{{- end }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: celln-system
  labels:
    app.kubernetes.io/part-of: sympozium
{{- if .Values.celln.installer.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: celln-agent-key
  namespace: celln-system
  labels:
    app.kubernetes.io/part-of: sympozium
type: Opaque
stringData:
  {{- if .Values.celln.anthropicApiKey }}
  ANTHROPIC_API_KEY: {{ .Values.celln.anthropicApiKey | quote }}
  {{- end }}
  {{- if .Values.celln.openaiApiKey }}
  OPENAI_API_KEY: {{ .Values.celln.openaiApiKey | quote }}
  {{- end }}
  {{- if .Values.celln.deepseekApiKey }}
  DEEPSEEK_API_KEY: {{ .Values.celln.deepseekApiKey | quote }}
  {{- end }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: celln-installer
  namespace: celln-system
  labels:
    app.kubernetes.io/name: celln-installer
    app.kubernetes.io/part-of: sympozium
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: celln-installer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: celln-installer
    spec:
      hostPID: true
      containers:
      - name: installer
        image: {{ .Values.celln.image.repository | default "ghcr.io/sympozium-ai/celln-installer" }}:{{ .Values.celln.image.tag | default "v0.4.13" }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        securityContext:
          privileged: true
        env:
        - name: DEEPSEEK_API_KEY
          valueFrom:
            secretKeyRef:
              name: celln-agent-key
              key: DEEPSEEK_API_KEY
              optional: true
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: celln-agent-key
              key: ANTHROPIC_API_KEY
              optional: true
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: celln-agent-key
              key: OPENAI_API_KEY
              optional: true
        - name: OPENAI_BASE_URL
          valueFrom:
            secretKeyRef:
              name: celln-agent-key
              key: OPENAI_BASE_URL
              optional: true
        volumeMounts:
        - name: host-root
          mountPath: /host
        - name: host-run
          mountPath: /run/systemd
        - name: kvm
          mountPath: /dev/kvm
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
      volumes:
      - name: host-root
        hostPath:
          path: /
          type: Directory
      - name: host-run
        hostPath:
          path: /run
          type: Directory
      - name: kvm
        hostPath:
          path: /dev/kvm
          type: CharDevice
      nodeSelector:
        celln.dev/kvm: "true"
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
{{- end }}
---
# Every replica sees the same backend identities and durable owner ledger.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celln-router
  namespace: celln-system
  labels:
    app.kubernetes.io/name: celln-router
    app.kubernetes.io/part-of: sympozium
spec:
  replicas: {{ .Values.celln.router.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: celln-router
  template:
    metadata:
      labels:
        app.kubernetes.io/name: celln-router
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: router
        image: {{ printf "%s@%s" .Values.celln.router.image.repository .Values.celln.router.image.digest | quote }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command: ["/usr/local/bin/celln"]
        args:
        - route
        - --listen
        - 0.0.0.0:8788
        - --backends
        - {{ join "," .Values.celln.router.backends | quote }}
        - --token-file
        - /etc/celln/backend/token
        - --client-token-file
        - /etc/celln/client/token
        - --ownership-dir
        - /var/lib/celln/ownership
        - --mode
        - round-robin
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        ports:
        - name: http
          containerPort: 8788
          protocol: TCP
        volumeMounts:
        - name: client-token
          mountPath: /etc/celln/client
          readOnly: true
        - name: backend-token
          mountPath: /etc/celln/backend
          readOnly: true
        - name: ownership
          mountPath: /var/lib/celln/ownership
        resources:
          requests:
            memory: "16Mi"
            cpu: "10m"
          limits:
            memory: "64Mi"
            cpu: "200m"
      volumes:
      - name: client-token
        secret:
          secretName: {{ .Values.celln.router.clientTokenSecret | quote }}
          defaultMode: 0440
      - name: backend-token
        secret:
          secretName: {{ .Values.celln.router.backendTokenSecret | quote }}
          defaultMode: 0440
      - name: ownership
        persistentVolumeClaim:
          claimName: {{ .Values.celln.router.ownershipClaim | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: celln-router
  namespace: celln-system
  labels:
    app.kubernetes.io/name: celln-router
    app.kubernetes.io/part-of: sympozium
spec:
  selector:
    app.kubernetes.io/name: celln-router
  ports:
  - name: http
    port: 8787
    targetPort: 8788
    protocol: TCP
{{- end }}
