---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.2
  name: harnesssessions.sympozium.ai
spec:
  group: sympozium.ai
  names:
    kind: HarnessSession
    listKind: HarnessSessionList
    plural: harnesssessions
    singular: harnesssession
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.agentRef
      name: Agent
      type: string
    - jsonPath: .spec.runtimeRef
      name: Runtime
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          HarnessSession is a persistent, Agent-owned adapter process. It is separate
          from AgentRun on purpose: completed one-shot runs remain Jobs while this CR
          owns the Deployment and private Service required for interactive use.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: HarnessSessionSpec is the desired persistent session state.
            properties:
              agentRef:
                description: |-
                  AgentRef is the Agent whose credential allowlist and model routing bound
                  this session. The controller rejects a missing Agent.
                type: string
              desiredState:
                default: running
                description: |-
                  DesiredState starts or stops the session. Stopping removes the Deployment
                  and Service while preserving this CR's audit status.
                enum:
                - running
                - stopped
                type: string
              idleTimeout:
                description: |-
                  IdleTimeout stops the session workload after this period without an active
                  authenticated chat request. The PVC and HarnessSession are preserved.
                type: string
              runtimeRef:
                description: |-
                  RuntimeRef is an administrator-approved AgentRuntime implementing the
                  v1alpha2 persistent session contract.
                type: string
            required:
            - agentRef
            - runtimeRef
            type: object
          status:
            description: HarnessSessionStatus is the observed lifecycle and immutable
              provenance.
            properties:
              activeRequests:
                description: ActiveRequests prevents idle timeout from stopping in-flight
                  model work.
                format: int32
                type: integer
              conditions:
                description: Conditions represent the latest observations.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              endpoint:
                description: |-
                  Endpoint is an internal-only URL for the Sympozium API server. It is
                  status/audit information, not a browser-facing endpoint.
                type: string
              errorCount:
                description: ErrorCount is the number of requests that failed or were
                  cancelled.
                format: int64
                type: integer
              lastActivityTime:
                description: LastActivityTime is updated when an authenticated chat
                  starts or completes.
                format: date-time
                type: string
              lastRequestCompletedAt:
                format: date-time
                type: string
              lastRequestID:
                description: LastRequestID is returned to the caller in X-Sympozium-Request-ID.
                type: string
              lastRequestStartedAt:
                description: LastRequestStartedAt and LastRequestCompletedAt bound
                  the latest request.
                format: date-time
                type: string
              lastRequestState:
                description: LastRequestState is started, succeeded, failed, or cancelled.
                type: string
              phase:
                description: Phase is Pending, Ready, Draining, or Failed.
                type: string
              requestCount:
                description: RequestCount is the number of chat requests accepted
                  by the API proxy.
                format: int64
                type: integer
              resolvedImageDigest:
                description: ResolvedImageDigest records the exact adapter image selected
                  at creation.
                type: string
              serviceName:
                description: ServiceName is the private in-namespace Service owned
                  by this session.
                type: string
              usageAccounting:
                description: UsageAccounting is unavailable until adapters report
                  trustworthy usage.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
